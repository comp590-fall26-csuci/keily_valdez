- name: Setup Apache Web Server
  hosts: webservers
  become: true

  tasks:
    - name: Install asciinema
      apt:
        name: asciinema
        state: present

    - name: Install apache2
      apt:
        name: apache2
        state:  present
        update_cache: yes

    - name: Start and enable Apache
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Show completion msg
      debug:
        msg: "all done!"
